name: Efood integration
on:
  pull_request:
  push:
    branches: [feat/own-api-integration]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      REACT_APP_EFOOD_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
      - run: npm run build
